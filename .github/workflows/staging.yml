# .github/workflows/staging.yml
#
# TEMPORARY bootstrap version — only clones/updates the repo on the
# staging server. No .env check, no migrations, no systemd restart, since
# none of those exist on the server yet. Once .env and the
# surfmind-staging.service unit are set up manually on the server,
# restore the full deploy flow (env check, venv, alembic upgrade,
# service restart) before the next push.
name: Deploy Staging

on:
  push:
    branches: [staging]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Bootstrap repo on staging server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          set -e

          mkdir -p surfmind
          cd surfmind

          if [ ! -d surfmind-backend-staging/.git ]; then
            echo "No repo at surfmind-backend-staging yet — cloning..."
            git clone git@github.com:mohdzain98/surfmind-backend.git surfmind-backend-staging
          else
            echo "Repo already exists — fetching and resetting to origin/staging..."
            cd surfmind-backend-staging
            git fetch origin
            git checkout staging
            git reset --hard origin/staging
            git clean -fd -e data/ -e logs/ -e senv/ -e .env
            cd ..
          fi

          echo "Bootstrap complete. Repo is cloned/updated on the server."
          echo "Nothing else was run: no .env check, no venv, no migrations, no service restart."
