# .github/workflows/staging.yml
#
# TEMPORARY bootstrap version — clones/updates the repo and sets up the
# venv on the staging server, nothing else. No .env check, no migrations,
# no systemd restart, since none of those exist on the server yet. The
# venv is needed now so its interpreter/uvicorn path
# (surfmind-backend-staging/senv/bin/...) is known before writing the
# surfmind-staging.service unit and the nginx config by hand. Once .env
# and the systemd unit exist, restore the full deploy flow (env check,
# alembic upgrade, service restart) before the next push.
name: Deploy Staging

on:
  push:
    branches: [staging]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Bootstrap repo on staging server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          set -e

          mkdir -p surfmind
          cd surfmind

          if [ ! -d surfmind-backend-staging/.git ]; then
            echo "No repo at surfmind-backend-staging yet — cloning..."
            git clone git@github.com:mohdzain98/surfmind-backend.git surfmind-backend-staging
          else
            echo "Repo already exists — fetching and resetting to origin/staging..."
            cd surfmind-backend-staging
            git fetch origin
            git checkout staging
            git reset --hard origin/staging
            git clean -fd -e data/ -e logs/ -e senv/ -e .env
            cd ..
          fi

          if [ ! -d senv ]; then
            echo "No virtualenv yet — creating one..."
            python3.11 -m venv senv
          fi

          echo "Activating virtual environment..."
          source senv/bin/activate

          echo "Installing dependencies..."
          pip install -r requirements.txt
          cp requirements.txt requirements.lock

          echo "Bootstrap complete. Repo and venv are set up on the server at:"
          echo "  $(pwd)"
          echo "  interpreter: $(pwd)/senv/bin/python"
          echo "  uvicorn:     $(pwd)/senv/bin/uvicorn"
          echo "Nothing else was run: no .env check, no migrations, no service restart."
